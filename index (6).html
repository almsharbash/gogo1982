<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b2858" id="meta-theme" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="كلمات" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="كلمات | Kalimat — مساحة عربية للمشاركة والحوار والاستماع والمشاهدة." />
<link rel="icon" type="image/svg+xml" href="kalimat-logo.svg" />
<link rel="manifest" href="kalimat.webmanifest" />
<link rel="apple-touch-icon" href="kalimat-icon-180.png" />
<title>كلمات | Kalimat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#eaf2fc;--card:#fff;--card2:#f2f7fd;--ink:#14263d;--muted:#566b86;--line:#d8e4f2;--blue:#2563b0;--blue-d:#16407c;--btn:#2563b0;--btn-h:#1b4a86;--soft:#e1edfb;--gold:#f4b942;--gold-d:#8a5a00;--danger:#c0392b;--ok:#1f8a6b;--shadow:0 6px 22px rgb(22 64 124/8%);--top1:#15407a;--top2:#0b2858;color-scheme:light;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif}
[data-theme=dark]{--bg:#07142a;--card:#0e2341;--card2:#12294b;--ink:#e8f0fc;--muted:#9bb0cc;--line:#1c3861;--blue:#6db0f5;--blue-d:#a8cdfa;--btn:#2f78d0;--btn-h:#3c8de6;--soft:#14305a;--gold-d:#f4b942;--danger:#ff8a7a;--ok:#53d1ae;--shadow:0 6px 22px rgb(0 0 0/35%);--top1:#0f2d5c;--top2:#0a2146;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:84px;font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:inherit;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid rgb(60 141 230/55%);outline-offset:2px}
.ic{width:1.25rem;height:1.25rem;flex:0 0 auto;display:inline-block;vertical-align:middle}
[hidden]{display:none!important}
.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;min-height:68px;padding:0 max(18px,calc((100vw - 1240px)/2));background:linear-gradient(135deg,var(--top1),var(--top2));color:#fff;box-shadow:0 2px 12px rgb(10 30 60/25%)}
.brand{display:inline-flex;align-items:center;gap:10px;color:#fff}
.brand svg{width:42px;height:42px;filter:drop-shadow(0 2px 4px rgb(0 0 0/25%))}
.brand-text{display:grid;line-height:1.05}
.brand-ar{font-size:1.45rem;font-weight:700}
.brand-en{font-family:Manrope,Arial,sans-serif;font-size:.68rem;font-weight:800;letter-spacing:.32em;color:var(--gold);direction:ltr;text-align:right}
.top-nav{display:flex;justify-content:center;align-self:stretch;gap:4px}
.top-nav a{position:relative;display:grid;place-content:center;justify-items:center;gap:2px;min-width:72px;border-bottom:4px solid transparent;color:rgb(255 255 255/78%);font-size:.72rem}
.top-nav a.active{border-bottom-color:var(--gold);color:#fff}
.top-nav a:hover{color:#fff}
.top-tools{display:flex;gap:6px}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border:0;border-radius:13px;background:rgb(255 255 255/12%);color:#fff}
.icon-btn:hover{background:rgb(255 255 255/22%)}
.badge{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#102a52;font-size:.65rem;font-weight:700;line-height:18px;text-align:center}
.layout{display:grid;grid-template-columns:250px minmax(0,640px) 280px;justify-content:center;align-items:start;gap:24px;max-width:1240px;margin:24px auto 90px;padding:0 16px}
.sidebar,.rail{position:sticky;top:90px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.card{border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow)}
.nav-card{padding:10px}
.nav-link{display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;border:0;border-radius:13px;background:transparent;color:var(--muted);text-align:right;position:relative}
.nav-link:hover{background:var(--card2)}
.nav-link.active{background:var(--soft);color:var(--blue-d);font-weight:700}
.nav-link .badge{position:static;margin-inline-start:auto}
.mini{display:flex;align-items:center;gap:10px;padding:12px;color:inherit}
.who{display:grid;min-width:0;line-height:1.35}
.who strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.handle{direction:ltr;text-align:right;color:var(--muted);font-family:Arial,sans-serif;font-size:.74rem}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.avatar{display:grid;flex:0 0 auto;width:42px;height:42px;place-items:center;border-radius:14px;color:#fff;font-weight:700;overflow:hidden;background-size:cover;background-position:center}
.avatar.sm{width:34px;height:34px;border-radius:11px;font-size:.85rem}
.avatar.lg{width:78px;height:78px;border-radius:24px;font-size:1.6rem;border:4px solid var(--card)}
.vf{display:inline-grid;place-items:center;width:15px;height:15px;margin-inline-start:4px;border-radius:50%;background:var(--gold);color:#102a52;vertical-align:middle}
.vf .ic{width:10px;height:10px;stroke-width:3}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px}
.head h1{margin:0;color:var(--blue-d);font-size:1.4rem}
.head p{margin:3px 0 0;color:var(--muted);font-size:.82rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted);font-size:.8rem}
.chip.on{border-color:transparent;background:var(--btn);color:#fff;font-weight:600}
.tabs{display:flex;gap:6px;padding:0 2px;overflow-x:auto}
.tab{padding:9px 15px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--muted);white-space:nowrap}
.tab.on{border-color:var(--line);background:var(--card);color:var(--blue-d);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border:0;border-radius:13px;background:var(--btn);color:#fff;font-weight:600}
.btn:hover{background:var(--btn-h)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:34px;padding:0 12px;font-size:.8rem;border-radius:11px}
.btn.ghost{background:var(--soft);color:var(--blue-d)}
.btn.ghost:hover{background:var(--line)}
.btn.out{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.gold{background:var(--gold);color:#102a52}
.composer{padding:16px 18px 12px}
.ctop{display:flex;gap:12px;align-items:flex-start}
.ctop textarea,.field textarea{flex:1;width:100%;min-height:78px;resize:vertical;border:0;border-bottom:1px solid var(--line);background:transparent;line-height:1.8;padding:4px 2px}
.ctop textarea::placeholder{color:var(--muted)}
.cfoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.cfoot .grow{flex:1}
.tool{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:0;border-radius:11px;background:var(--card2);color:var(--muted);font-size:.78rem}
.tool:hover{color:var(--blue-d);background:var(--soft)}
.sel{padding:7px 10px;border:1px solid var(--line);border-radius:11px;background:var(--card);font-size:.78rem}
.cnt{color:var(--muted);font-size:.76rem}
.preview{position:relative;margin:10px 0 0}
.preview img,.pimg{display:block;width:100%;max-height:430px;object-fit:cover;border-radius:14px;background:var(--card2)}
.preview .x{position:absolute;top:8px;left:8px;width:32px;height:32px;border:0;border-radius:50%;background:rgb(0 0 0/55%);color:#fff;display:grid;place-items:center}
.emojis{display:flex;flex-wrap:wrap;gap:2px;margin-top:8px;padding:8px;border-radius:14px;background:var(--card2)}
.emojis button{width:36px;height:36px;border:0;border-radius:9px;background:transparent;font-size:1.2rem}
.emojis button:hover{background:var(--soft)}
.stories{padding:14px}
.sec{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec h2{margin:0;color:var(--blue-d);font-size:1rem}
.sec span{color:var(--muted);font-size:.75rem}
.srow{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px}
.story{position:relative;flex:0 0 100px;height:140px;overflow:hidden;border:0;border-radius:16px;color:#fff;text-align:right;padding:0}
.story .avatar{position:absolute;top:9px;right:9px;border:3px solid var(--gold)}
.story.seen .avatar{border-color:rgb(255 255 255/55%)}
.story .sn{position:absolute;right:9px;left:7px;bottom:9px;font-size:.72rem;font-weight:700;text-shadow:0 1px 5px rgb(0 0 0/45%)}
.story.add{background:var(--soft)!important;color:var(--blue-d);display:grid;place-content:center;justify-items:center;gap:8px;text-align:center}
.story.add .plus{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--btn);color:#fff}
.post{padding:16px 18px 10px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.au{display:flex;align-items:center;gap:10px;min-width:0}
.meta{color:var(--muted);font-size:.72rem;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.meta .ic{width:.85rem;height:.85rem}
.ptext{margin:14px 0;font-size:.95rem;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere}
.ptext a{color:var(--blue);font-weight:600}
.pimg{margin:0 0 12px;cursor:zoom-in}
.counts{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px;color:var(--muted);font-size:.74rem;gap:8px;flex-wrap:wrap}
.acts{position:relative;display:flex;gap:2px;border-top:1px solid var(--line);padding-top:6px}
.ab{display:inline-flex;flex:1;align-items:center;justify-content:center;gap:6px;min-height:40px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:.78rem}
.ab:hover{background:var(--card2)}
.ab.on{color:var(--blue)}
.ab.rxon{color:var(--danger)}
.ab.rxmore{flex:0 0 28px;padding:0}
.pop{position:absolute;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 34px rgb(10 30 60/25%);padding:6px}
.pop.rx{bottom:46px;right:6px;display:flex;gap:2px}
.pop.rx button{width:44px;height:44px;border:0;border-radius:12px;background:transparent;font-size:1.5rem}
.pop.rx button:hover,.pop.rx button.cur{background:var(--soft);transform:scale(1.12)}
.pop.menu{top:34px;left:0;min-width:210px;display:grid}
.pop.menu button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:10px;background:transparent;text-align:right;font-size:.85rem}
.pop.menu button:hover{background:var(--card2)}
.pop.menu .dg{color:var(--danger)}
.pop.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.pop.menu .ok{margin-inline-start:auto;color:var(--ok)}
.pw{position:relative}
.comments{display:grid;gap:9px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.cm{display:flex;gap:9px}
.cm.reply{margin-inline-start:34px}
.cb{flex:1;min-width:0}
.cbub{display:inline-block;max-width:100%;padding:8px 12px;border-radius:14px;background:var(--card2);font-size:.85rem;line-height:1.7;overflow-wrap:anywhere}
.cbub strong{display:block;font-size:.8rem}
.cbub .men{color:var(--blue);font-weight:600}
.cacts{display:flex;gap:12px;margin:2px 6px;color:var(--muted);font-size:.72rem;flex-wrap:wrap}
.cacts button{border:0;background:none;padding:2px 0;color:inherit;font-size:inherit}
.cacts button:hover{color:var(--blue)}
.cacts .liked{color:var(--danger);font-weight:700}
.cform{display:flex;gap:8px}
.cform input,.in{flex:1;min-width:0;padding:10px 13px;border:1px solid var(--line);border-radius:13px;background:var(--card)}
.rchip{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;border-radius:10px;background:var(--soft);color:var(--blue-d);font-size:.76rem}
.rchip button{border:0;background:none;color:inherit}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--muted)}
.search input{width:100%;height:44px;border:0;outline:0;background:transparent}
.rowu{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rowu:first-of-type{border-top:0}
.rowu .who{flex:1}
.side{padding:15px}
.side h2{margin:0 0 8px;color:var(--blue-d);font-size:.95rem}
.tag{display:flex;justify-content:space-between;padding:7px 0;color:var(--blue);font-weight:600;font-size:.85rem}
.tag small{color:var(--muted);font-weight:400}
.tip{background:linear-gradient(135deg,var(--soft),var(--card));border-color:var(--line)}
.tip strong{color:var(--gold-d);font-size:.78rem}
.tip p{margin:6px 0 0;color:var(--muted);font-size:.82rem;line-height:1.9}
.pcard{overflow:hidden;padding-bottom:16px}
.cover{height:130px}
.pdet{display:flex;align-items:flex-end;gap:12px;margin:-36px 18px 0}
.pcard h2{margin:8px 18px 0;color:var(--blue-d);font-size:1.25rem}
.pcard .bio{margin:6px 18px;color:var(--muted);font-size:.9rem;line-height:1.8}
.stats{display:flex;gap:22px;margin:10px 18px;color:var(--muted);font-size:.8rem}
.stats strong{display:block;color:var(--ink);font-size:1.05rem}
.stats button{border:0;background:none;padding:0;text-align:right}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin:0 18px}
.empty{padding:34px 18px;color:var(--muted);text-align:center}
.empty strong{display:block;margin-bottom:6px;color:var(--blue-d)}
.empty p{margin:0;font-size:.85rem;line-height:1.8}
.nrow{display:flex;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0}
.nrow.unread{background:var(--soft)}
.nrow .nt{flex:1;font-size:.88rem}
.nrow time{color:var(--muted);font-size:.72rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}
.msgs{display:grid;grid-template-columns:270px 1fr;gap:12px;min-height:60vh}
.clist{overflow:hidden;align-self:start}
.crow{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow.on{background:var(--soft)}
.crow .who{flex:1}
.crow .last{color:var(--muted);font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread{display:flex;flex-direction:column;min-height:60vh;overflow:hidden}
.thead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tbody{flex:1;display:flex;flex-direction:column;gap:8px;padding:14px;overflow-y:auto;max-height:55vh}
.bub{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--card2);overflow-wrap:anywhere;font-size:.9rem}
.bub.me{align-self:flex-start;background:var(--btn);color:#fff}
.bub small{display:flex;gap:8px;margin-top:3px;font-size:.66rem;opacity:.75}
.bub small button{border:0;background:none;color:inherit;padding:0;font-size:inherit;text-decoration:underline}
.tfoot{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.note{margin:0;padding:10px 14px;background:var(--soft);color:var(--blue-d);font-size:.76rem}
.set{padding:6px 0}
.set h3{margin:0;padding:12px 18px 4px;color:var(--blue-d);font-size:.92rem}
.srow2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid var(--line)}
.srow2 .d{color:var(--muted);font-size:.76rem}
.srow2 > div:first-child{flex:1;min-width:0}
.tg{position:relative;width:46px;height:26px;border:0;border-radius:13px;background:var(--line);flex:0 0 auto}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tg[aria-checked=true]{background:var(--btn)}
.tg[aria-checked=true]::after{right:23px}
.mobile-nav,.fab{display:none}
.toast{position:fixed;z-index:60;right:50%;bottom:90px;transform:translateX(50%);max-width:90vw;padding:11px 18px;border-radius:13px;background:#0f2d5c;color:#fff;box-shadow:var(--shadow);font-size:.85rem}
.backdrop{position:fixed;z-index:40;inset:0;display:grid;place-items:center;padding:16px;background:rgb(6 18 38/62%)}
.modal{width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:22px;background:var(--card);box-shadow:0 24px 70px rgb(0 0 0/40%);outline:0}
.modal.wide{width:min(900px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.mh h2{margin:0;color:var(--blue-d);font-size:1.05rem}
.mb{padding:8px 18px 18px;display:grid;gap:12px}
.mx{border:0;background:var(--card2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.field{display:grid;gap:5px}
.field label,.field .lb{font-size:.8rem;color:var(--muted)}
.field input[type=text],.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.field textarea{min-height:90px;border-bottom:1px solid var(--line)}
.field .err{color:var(--danger);font-size:.76rem}
.swr{display:flex;flex-wrap:wrap;gap:8px}
.sw input{position:absolute;opacity:0}
.sw span{display:block;width:36px;height:36px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw input:checked+span{border-color:var(--card);box-shadow:0 0 0 3px var(--btn)}
.sw.cv span{width:56px;border-radius:12px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.ma{display:flex;gap:8px;justify-content:flex-end}
.lightbox{padding:0;background:transparent;box-shadow:none;width:auto}
.lightbox img{max-width:94vw;max-height:88vh;border-radius:14px;display:block}
.sv{position:fixed;z-index:50;inset:0;display:grid;place-items:center;background:rgb(4 12 28/88%)}
.svc{position:relative;display:grid;align-content:center;width:min(400px,100vw);height:min(720px,100vh);padding:28px 24px;color:#fff;overflow:hidden;border-radius:22px}
.svc::before{content:"";position:absolute;inset:40% -20% -30% 20%;border-radius:50%;background:rgb(255 255 255/12%)}
.bars{position:absolute;top:10px;right:12px;left:12px;display:flex;gap:4px}
.bars i{flex:1;height:3px;border-radius:2px;background:rgb(255 255 255/35%);overflow:hidden}
.bars i.done{background:#fff}
.bars i.cur::after{content:"";display:block;height:100%;background:#fff;transform-origin:right;animation:fill 6s linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.svh{position:absolute;top:24px;right:14px;left:14px;display:flex;align-items:center;gap:10px;z-index:2}
.svh .who{flex:1;color:#fff}.svh .handle{color:rgb(255 255 255/75%)}
.svh button{width:38px;height:38px;border:0;border-radius:50%;background:rgb(0 0 0/30%);color:#fff;display:grid;place-items:center}
.svt{position:relative;z-index:1;font-size:1.35rem;line-height:1.9;text-align:center;text-shadow:0 1px 8px rgb(0 0 0/35%);overflow-wrap:anywhere;white-space:pre-wrap}
.sz{position:absolute;top:70px;bottom:0;width:38%;border:0;background:transparent;z-index:1}
.sz.n{left:0}.sz.p{right:0}
.spin{height:120px;border-radius:16px;margin-top:8px;display:grid;place-items:center;color:#fff;font-weight:700;text-align:center;padding:10px}
.hero{display:grid;justify-items:center;gap:8px;padding:6px 0 4px;text-align:center}
.hero svg{width:84px;height:84px}
.hero .a{font-size:2rem;font-weight:700;color:var(--blue-d);line-height:1}
.hero .e{font-family:Manrope,Arial,sans-serif;font-weight:800;letter-spacing:.4em;color:var(--blue);font-size:.8rem;direction:ltr}

.field input:not([type=checkbox]):not([type=radio]){width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}

function compress(file, max, square, q) {

      else { const r = Math.min(1, max / Math.max(iw, ih)); w = Math.round(iw * r); h = Math.round(ih * r); }
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));

    img.src = url;

}

  if (k === "q" || k === "pq") { clearTimeout(input.t); input.t = setTimeout(() => render(), 160); }
});
function input() {}
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.comp === "vis") ui.composer.vis = el.value;
  if (el.dataset.comp === "feel") ui.composer.feel = el.value;
  if (el.id === "file-any" && el.files[0]) { const f = el.files[0], cb = anyCb; el.value = ""; anyCb = null; if (cb) cb(f); }
  if (el.dataset.comp === "off") ui.composer.off = el.checked;
  if (el.id === "file-post" && el.files[0]) compress(el.files[0], 1080, false, 0.72).then((d) => { ui.composer.img = d; render(); }).catch(() => toast("تعذّر قراءة الصورة.")).finally(() => { el.value = ""; });
  if (el.id === "file-avatar" && el.files[0]) compress(el.files[0], 256, true, 0.82).then((d) => { if (ui.avatarDirect) { ui.avatarDirect = false; me().avatarImg = d; save(true); render(); toast("تم تحديث الصورة الشخصية"); return; } ui.tmpAvatar = d; const p = $(".av-prev"); if (p) p.innerHTML = avatar({ ...me(), avatarImg: d }, "lg"); }).catch(() => toast("تعذّر قراءة الصورة.")).finally(() => { el.value = ""; });
  if (el.id === "file-cover" && el.files[0]) compress(el.files[0], 1280, false, 0.75).then((d) => { if (ui.coverDirect) { ui.coverDirect = false; me().coverImg = d; save(true); render(); toast("تم تحديث صورة الغلاف"); return; } ui.tmpCover = d; const cv = $(".cv-prev"); if (cv) cv.style.cssText = `height:84px;border-radius:12px;background-image:url('${d}')`; }).catch(() => toast("تعذّر قراءة الصورة.")).finally(() => { el.value = ""; });
  if (el.id === "file-import" && el.files[0]) {
    const f = el.files[0]; el.value = "";
    f.text().then((t) => { const n = normalize(JSON.parse(t)); if (!n) throw new Error("bad"); confirmBox("استبدال بياناتك الحالية بمحتوى هذا الملف؟", "استيراد", () => { state = n; save(true); closeModal(); render({ top: true }); toast("تم الاستيراد"); }, false); }).catch(() => toast("الملف غير صالح."));
  }
  if (el.name === "bg" && !ui.storyImg) { const sp = $("#sp"); if (sp) sp.style.background = STORY_BG[+el.value]; }
});
document.addEventListener("submit", (e) => {
  const form = e.target, kind = form.dataset.form; if (!kind) return;
  e.preventDefault();
  const fd = new FormData(form), d = form.dataset;
  const err = (n, m) => { const s = form.querySelector(`[data-err="${n}"]`); if (s) s.textContent = m; };
  if (AUTH_FORMS[kind]) { guarded(form, () => AUTH_FORMS[kind](form, fd)); return; }
  if (!state) return;
  if (kind === "details") {
    const g = (n) => String(fd.get(n) || "").trim(); let site = g("website");
    if (site && !/^https?:\/\//i.test(site)) site = "https://" + site;
    if (site && !/^https?:\/\/[^\s]+\.[^\s]+$/.test(site)) return err("website", "اكتب رابطاً صحيحاً.");
    const m = me(); m.about = cleanAbout({ work: g("work"), education: g("education"), city: g("city"), hometown: g("hometown"), relation: g("relation"), gender: g("gender"), birthday: g("birthday"), website: site });
    m.detailsVis = VIS[g("detailsVis")] ? g("detailsVis") : "public"; m.showBirthday = !!fd.get("showBirthday"); m.showEmail = !!fd.get("showEmail");
    save(true); closeModal(); render(); toast("تم حفظ التفاصيل"); return;
  }
  if (kind === "search") { const q = (ui.drafts.rq || "").trim(); ui.drafts.q = q; ui.tab = "all"; location.hash = "#/explore"; if (location.hash === "#/explore") render({ top: true }); }
  if (kind === "post") {
    const text = (ui.drafts.post || "").trim(), c = ui.composer; if (!canPublish()) return;
    const poll = c.poll ? { options: pollOpts().map((t) => ({ t, votes: 0 })), myVote: null } : null;
    state.posts.unshift({ id: uid("p"), authorId: ME, text, image: c.img, bg: !c.img && !poll && c.bg != null ? c.bg : null, feeling: FEELINGS.includes(c.feel) ? c.feel : "", poll: cleanPoll(poll), repostOf: null, createdAt: Date.now(), edited: false, visibility: c.vis, commentsOff: c.off, reactions: { love: 0, like: 0, haha: 0, wow: 0, sad: 0 }, myReaction: null, saved: false, views: 0, shares: 0, comments: [] });
    ui.drafts.post = ""; [0, 1, 2, 3].forEach((i) => { delete ui.drafts["po" + i]; });
    ui.composer = { img: null, vis: state.settings.defVis, off: !state.settings.defComments, emoji: false };
    save(true); render({ top: true }); toast("تم نشر لحظتك");
  }
  if (kind === "repost") {
    const root = post(d.post); if (!root || root.visibility !== "public") return toast("لا يمكن إعادة نشر هذا المنشور.");
    const text = String(fd.get("text") || "").trim();
    state.posts.unshift({ id: uid("p"), authorId: ME, text, image: null, bg: null, feeling: "", poll: null, repostOf: root.id, createdAt: Date.now(), edited: false, visibility: state.settings.defVis, commentsOff: false, reactions: { love: 0, like: 0, haha: 0, wow: 0, sad: 0 }, myReaction: null, saved: false, views: 0, shares: 0, comments: [] });
    root.shares++; save(true); closeModal(); render({ top: true }); toast("تمت إعادة النشر على ملفك");
  }
  if (kind === "comment") {
    const pid = d.post, k = "c:" + pid, text = (ui.drafts[k] || "").trim(); if (!text) return;
    const p = post(pid), rep = ui.reply[pid];
    p.comments.push({ id: uid("c"), authorId: ME, text, at: Date.now(), likes: 0, liked: false, parentId: rep ? rep.rootId : null, edited: false });
    ui.drafts[k] = ""; delete ui.reply[pid]; ui.open.add(pid); save(); render();
  }
  if (kind === "edit-post") { const t = String(fd.get("text")).trim(); const p = post(d.post); if (!t && !p.image) return toast("لا يمكن ترك المنشور فارغاً."); if (t !== p.text) { p.text = t; p.edited = true; } save(); closeModal(); render(); toast("تم تحديث المنشور"); }
  if (kind === "edit-comment") { const t = String(fd.get("text")).trim(); if (!t) return; const c = post(d.post).comments.find((x) => x.id === d.cm); if (t !== c.text) { c.text = t; c.edited = true; } save(); closeModal(); render(); }
  if (kind === "report") { state.reports.push({ postId: d.post, reason: fd.get("reason"), note: String(fd.get("note") || ""), at: Date.now() }); if (!state.hidden.includes(d.post)) state.hidden.push(d.post); save(); closeModal(); render(); toast("شكراً، تم تسجيل البلاغ وأُخفي المنشور."); }
  if (kind === "story") { const t = String(fd.get("text")).trim(), img = ui.storyImg; if (!t && !img) return; state.stories.push({ id: uid("s"), authorId: ME, text: t, bg: +fd.get("bg") || 0, img: img || null, createdAt: Date.now() }); ui.storyImg = null; save(); closeModal(); render(); toast("تم نشر قصتك"); }
  if (kind === "chat") {
    const k = "m:" + d.user, t = (ui.drafts[k] || "").trim(); if (!t) return;
    ui.drafts[k] = ""; sendMsg(d.user, { text: t });
  }
  if (kind === "profile") {
    const name = String(fd.get("name")).trim(), handle = String(fd.get("handle")).trim().toLowerCase();
    err("name", ""); err("handle", "");
    if (!validName(name)) return err("name", "الاسم يجب أن يكون حروفاً فقط (٢–٤٠) دون رموز أو إيموجي.");
    if (!validHandle(handle)) return err("handle", "٣–٢٠ من الأحرف الإنجليزية والأرقام و _ و .");
    if (state.users.some((u) => u.id !== ME && u.handle.toLowerCase() === handle)) return err("handle", "هذا المعرّف مستخدم بالفعل.");
    const m = me(); m.name = name; m.handle = handle;
    if (kind === "profile") { m.bio = String(fd.get("bio")).trim().slice(0, 160); m.tone = +fd.get("tone") || 0; m.cover = +fd.get("cover") || 0; if (ui.tmpAvatar !== undefined) m.avatarImg = ui.tmpAvatar; if (ui.tmpCover !== undefined) m.coverImg = ui.tmpCover; }
    state.onboarded = true; save(true); closeModal(); render(); toast("تم حفظ الملف الشخصي");
  }
});
